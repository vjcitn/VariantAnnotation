on:
  push:
    branches: [towards_pages]

name: pkgdown

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'devel'
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev \
            libhdf5-dev libbz2-dev liblzma-dev zlib1g-dev

      - name: Install BiocManager and set devel repos
        run: |
          install.packages("BiocManager")
          BiocManager::install(version = "devel", ask = FALSE, update = FALSE)
        shell: Rscript {0}

      - name: Install remotes, pkgdown, and package dependencies
        run: |
          install.packages("remotes")
          BiocManager::install("pkgdown", ask = FALSE, update = FALSE)
          remotes::install_deps(dependencies = TRUE, repos = BiocManager::repositories())
        shell: Rscript {0}

      - name: Install package
        run: R CMD INSTALL .

      - name: Build pkgdown site
        run: Rscript -e 'pkgdown::build_site(new_process = FALSE)'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
